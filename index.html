<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
    <title>YASIF STORE - Kopi Kenangan Promo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        heading: ['"Outfit"', 'sans-serif'],
                    },
                    colors: {
                        background: '#F7F5F0',
                        surface: '#FFFDF8',
                        foreground: '#191B18',
                        primary: '#1F2A24',
                        accent: '#7A8F73',
                        border: '#E8E3DA',
                        subtle: '#77756D',
                    },
                    boxShadow: {
                        'float': '0 24px 80px -48px rgba(25, 27, 24, 0.35)',
                    }
                }
            }
        }
    </script>
    <style>
        * { transition: none !important; animation: none !important; }
        *:hover, *:active, *:focus { transform: none !important; }
        :root { --ys-bg: #F7F5F0; --ys-surface: #FFFDF8; --ys-ink: #191B18; --ys-muted: #77756D; --ys-line: #E8E3DA; --ys-accent: #7A8F73; }
        .theme-scope { --brand-accent: #B43A34; --brand-accent-dark: #4A1E1B; --brand-accent-soft: rgba(180, 58, 52, 0.105); --brand-accent-softer: rgba(180, 58, 52, 0.055); --brand-accent-border: rgba(180, 58, 52, 0.22); --brand-accent-contrast: #FFFDF8; }
        .brand-text { color: var(--brand-accent) !important; }
        .brand-border { border-color: var(--brand-accent-border) !important; }
        .brand-button { background: var(--brand-accent-dark) !important; color: var(--brand-accent-contrast) !important; border: 1px solid rgba(255,255,255,.14); }
        .brand-button-soft { background: var(--brand-accent-soft) !important; color: var(--brand-accent-dark) !important; border: 1px solid var(--brand-accent-border) !important; }
        .brand-hero-shell { position: relative; overflow: hidden; isolation: isolate; }
        .brand-hero-shell::before { content: ""; position: absolute; inset: auto -12% -32% auto; width: min(42vw, 520px); height: min(42vw, 520px); background: radial-gradient(circle, var(--brand-accent-soft) 0%, transparent 68%); z-index: -1; pointer-events: none; }
        .brand-option { background: linear-gradient(90deg, var(--brand-accent-softer), transparent 42%); }
        .theme-scope .product-frame { background: linear-gradient(180deg, rgba(255,255,255,.62), var(--brand-accent-softer)); border-color: var(--brand-accent-border); }
        .theme-scope select:focus, .theme-scope input:focus, .theme-scope textarea:focus { border-color: var(--brand-accent-border) !important; box-shadow: 0 0 0 1px var(--brand-accent-border) !important; }
        body { min-height: 100vh; background: linear-gradient(180deg, rgba(255,253,248,0.92) 0%, rgba(247,245,240,1) 42%, rgba(244,241,234,1) 100%); }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .glass { background: rgba(247, 245, 240, 1); border-bottom: 1px solid rgba(25, 27, 24, 0.08); }
        .premium-surface { background: rgba(255, 253, 248, 0.98) !important; border: 1px solid rgba(25, 27, 24, 0.075) !important; }
        .diffused-backdrop { background: rgba(15, 17, 15, 0.7); }
        .luxury-panel { background: rgba(255, 253, 248, 1); border: 1px solid rgba(255, 255, 255, 0.72); box-shadow: 0 40px 120px -70px rgba(0,0,0,.52); }
        .best-seller-shell { background: linear-gradient(135deg, rgba(255,253,248,1), rgba(255,253,248,.9)), radial-gradient(circle at 10% 0%, var(--brand-accent-soft), transparent 40%); border: 1px solid var(--brand-accent-border); }
        .modern-product-card, .featured-product-card { position: relative; background: rgba(255,253,248,1) !important; border: 1px solid rgba(25,27,24,.075) !important; }
        .modern-product-frame, .featured-product-frame { background: radial-gradient(circle at 50% 18%, rgba(255,255,255,.82), transparent 46%), linear-gradient(180deg, rgba(255,255,255,.72), var(--brand-accent-softer)); border: 1px solid var(--brand-accent-border); }
        .product-badge { background: rgba(255,253,248,1); color: var(--brand-accent-dark); border: 1px solid var(--brand-accent-border); }
        .add-pill { background: var(--brand-accent-dark); color: var(--brand-accent-contrast); border: 1px solid rgba(255,255,255,.14); }
        .quick-plus { background: rgba(255,253,248,1); color: var(--brand-accent-dark); border: 1px solid var(--brand-accent-border); }
        .category-rail { background: rgba(247,245,240,1) !important; border-bottom: 1px solid rgba(25,27,24,.06); }
        .cart-floating-pill { background: var(--brand-accent-dark) !important; border: 1px solid rgba(255, 253, 248, 0.24) !important; }
        @media (max-width: 640px) {
            .category-rail { top: 72px !important; z-index: 25 !important; padding-top: .72rem !important; padding-bottom: .72rem !important; }
            .brand-category-pill { padding: .58rem .95rem !important; font-size: 10px !important; letter-spacing: .11em !important; white-space: nowrap; }
        }
                /* Spinner loading boleh muter, sisanya tetap tanpa animasi */
        .animate-spin { animation: spin 0.8s linear infinite !important; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-background text-foreground antialiased selection:bg-primary selection:text-white pb-28 md:pb-32">

    <div id="app"></div>

    <script>
        var antiCache = new Date().getTime();
        document.write('<script src="data.js?v=' + antiCache + '"><\/script>');
    </script>

    <script>
        // --- KODE AUTO REFRESH MULAI DARI SINI ---
        const WEB_VERSION = "1.1"; 
        const currentLocalVersion = localStorage.getItem("yasif_web_version");
        
        if (currentLocalVersion !== WEB_VERSION) {
            localStorage.removeItem('yasif_cart');
            localStorage.removeItem('yasif_store');
            localStorage.setItem("yasif_web_version", WEB_VERSION);
            window.location.reload(true);
        }
        // --- KODE AUTO REFRESH SELESAI ---

        let savedCart = localStorage.getItem('yasif_cart');
        let parsedCart = savedCart ? JSON.parse(savedCart) : [];
        parsedCart = parsedCart.filter(item => item.brand === 'Kopi Kenangan');

        let savedStore = localStorage.getItem('yasif_store');
        let parsedStore = savedStore ? JSON.parse(savedStore) : null;

        let state = {
            selectedBrand: null, 
            kkStores: [],
            isLoadingStores: false,
            isLoadingMenu: false,
            showStoreSearch: false,
            selectedKKStore: parsedStore,
            showStorePrompt: false, 
            hasSeenStorePrompt: false, 
            storeSearchQuery: '',
            cart: parsedCart,
            showCart: false,
            showTutorial: false,
            showAvailabilityWarning: false,
            storeLocation: parsedStore ? parsedStore.name : '',
            activeProduct: null, 
            tempNote: '',
            tempQty: 1,
            tempSize: null,
            tempSugar: null,
            tempOatside: false,
            tempJuwara: false,
            orderType: 'now',
            scheduledTime: '',
            searchQuery: '',
            pickupNameType: 'custom', 
            customPickupName: '',
            autoClose: true,
            allowSingleItem: true,
            minPurchase32k: false,
            showStoreChangeConfirm: false,
            pendingStoreId: null,
            editingCartItemId: null,
            showProcessWarning: false,
            showScheduleWarning: false
        };

        window.syncLiveWithLocal = function(liveItems) {
            // 1. Cek apakah ini Store Premium berdasarkan harga "Kopi Kenangan Mantan" dari API
            let isPremiumStore = false;
            const kkmLive = liveItems.find(live => live.name.toLowerCase().trim() === "kopi kenangan mantan");
            
            if (kkmLive) {
                const kkmPrice = kkmLive.outletPrice || kkmLive.normalPrice || 19000;
                if (kkmPrice > 19000) { // Jika di atas 19.000, otomatis dikategorikan Store Premium
                    isPremiumStore = true;
                }
            }

            window.products.forEach(localProduct => {
                const liveMatch = liveItems.find(live => 
                    live.name.toLowerCase().trim() === localProduct.name.toLowerCase().trim()
                );

                if (liveMatch) {
                    // 2. Ketersediaan (Sold Out) & Harga Regular 100% ikut API
                    localProduct.isSoldOut = liveMatch.isSoldOut;
                    
                    const apiRegPrice = liveMatch.outletPrice || liveMatch.normalPrice || localProduct.originalPrice;
                    localProduct.originalPrice = apiRegPrice;
                    localProduct.promoPrice = Math.floor((apiRegPrice * 0.5) + 3500); // Profit tetap 3.500

                    // 3. Atur Harga Spesifik per Ukuran
                    if (localProduct.sizes && localProduct.sizes.length > 0) {
                        
                        // Set Harga Regular = Ngikut API
                        const regSize = localProduct.sizes.find(s => s.name === "Regular");
                        if (regSize) {
                            regSize.originalPrice = localProduct.originalPrice;
                            regSize.promoPrice = localProduct.promoPrice;
                        }
                        
                        // Set Harga Large = Ngikut Data Lokal / Premium
                        // Set Harga Large = Ngikut Data Lokal / Premium
                        const largeSize = localProduct.sizes.find(s => s.name === "Large");
                        if (largeSize) {
                            if (largeSize.baseLrgPrice === undefined) {
                                largeSize.baseLrgPrice = largeSize.originalPrice;
                            }

                            let finalLargePrice = largeSize.baseLrgPrice; // Default harga toko biasa

                            // Jika terdeteksi Store Premium, ambil harga Large langsung dari data.js
                            if (isPremiumStore && window.PREMIUM_PRICES && window.PREMIUM_PRICES[localProduct.name]) {
                                finalLargePrice = window.PREMIUM_PRICES[localProduct.name];
                            }

                            largeSize.originalPrice = finalLargePrice;
                            largeSize.promoPrice = Math.floor((finalLargePrice * 0.5) + 3500);
                        }
                    }
                } else {
                    localProduct.isSoldOut = true;
                }
            });
        };

        window.fetchLiveMenu = async function(storeCode) {
            state.isLoadingMenu = true; 
            render(); 

            try {
const url = `https://zonafitrinet.my.id/api/kopken/menu?outlet=${storeCode}&_t=${new Date().getTime()}`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.success && data.items) {
                    window.syncLiveWithLocal(data.items);
                }
            } catch (error) {
                console.error("Gagal menarik data real-time:", error);
                showToast("Gagal cek stok real-time, menggunakan harga standar.", "error");
            } finally {
                state.isLoadingMenu = false;
            }
        };

        function generateTimeOptions() {
            const options = [];
            const now = new Date();
            now.setMinutes(now.getMinutes() + 30);

            const minutes = now.getMinutes();
            const remainder = minutes % 15;
            if (remainder !== 0) {
                now.setMinutes(minutes + (15 - remainder));
            }

            const endOfDay = new Date(now);
            endOfDay.setHours(23, 45, 0, 0);

            let currentTime = new Date(now);
            while (currentTime <= endOfDay) {
                const hh = String(currentTime.getHours()).padStart(2, '0');
                const mm = String(currentTime.getMinutes()).padStart(2, '0');
                options.push(`${hh}:${mm}`);
                currentTime.setMinutes(currentTime.getMinutes() + 15);
            }
            return options;
        }

        if (state.kkStores.length === 0) {
            state.isLoadingStores = true;
            fetch('stores.json')
                .then(res => res.json())
                .then(data => {
                    state.kkStores = data.map(s => ({
                        id: s.id,
                        code: s.code,
                        name: s.name.trim(),
                        address: s.address
                    }));
                    state.isLoadingStores = false;
                    if(typeof render === 'function') render();
                })
                .catch(err => {
                    console.error(err);
                    state.isLoadingStores = false;
                    showToast('Gagal memuat daftar cabang!', 'error');
                    if(typeof render === 'function') render();
                });
        }

        function saveCart() { localStorage.setItem('yasif_cart', JSON.stringify(state.cart)); }

        window.safeBack = function() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.hash = state.selectedBrand ? 'brand-' + encodeURIComponent(state.selectedBrand) : '';
            }
        };

        const formatPrice = (price) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(price || 0);
        const getTotalItems = () => state.cart.reduce((sum, item) => sum + (item.quantity || 0), 0);
        const getTotalPrice = () => {
            let sum = state.cart.reduce((s, item) => s + ((item.promoPrice || 0) * (item.quantity || 0)), 0);
            if (state.allowSingleItem && state.cart.length > 0 && getTotalItems() === 1) {
                sum += 2000;
            }
            return sum;
        };
        const escapeHtml = (value) => String(value || '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));

        window.selectKKStore = function(storeId) {
            const store = state.kkStores.find(s => s.id === storeId);
            if (store) {
                if (state.selectedKKStore && state.selectedKKStore.id !== storeId && state.cart.length > 0) {
                    state.pendingStoreId = storeId;
                    state.showStoreChangeConfirm = true;
                    render();
                    return;
                }
                executeStoreChange(store);
            }
        }

        async function executeStoreChange(store) {
            state.selectedKKStore = store;
            localStorage.setItem('yasif_store', JSON.stringify(store));
            state.showStoreSearch = false;
            state.storeLocation = store.name; 
            
            if (store.code) {
                await window.fetchLiveMenu(store.code);
            }
            
            state.showAvailabilityWarning = true; 
            render(); 
        }

        window.confirmStoreChange = function() {
            state.cart = [];
            saveCart();
            state.showStoreChangeConfirm = false;
            const store = state.kkStores.find(s => s.id === state.pendingStoreId);
            if (store) {
                executeStoreChange(store);
            }
            showToast('Keranjang dikosongkan untuk menyesuaikan harga.', 'error');
        }

        window.cancelStoreChange = function() {
            state.showStoreChangeConfirm = false;
            state.pendingStoreId = null;
            render();
        }

        // --- KODE BARU: REFRESH DATA SAAT LANJUT PESANAN ---
        window.lanjutPesanan = async function() {
            state.showStorePrompt = false;
            if (state.selectedKKStore && state.selectedKKStore.code) {
                await window.fetchLiveMenu(state.selectedKKStore.code);
            }
            state.showAvailabilityWarning = true;
            render();
        };
        // ---------------------------------------------------

        window.handleStoreSearch = function(query) {
            state.storeSearchQuery = query;
            const container = document.getElementById('store-list-container');
            if (!container) return;
            
            const q = query.toLowerCase();
            if (!q) {
                container.innerHTML = `<div class="text-center py-12 text-subtle text-sm font-medium flex flex-col items-center gap-3"><span class="text-3xl">🏬</span>Ketik nama cabang atau alamat untuk mencari...</div>`;
                return;
            }

            const normalize = (str) => String(str).toLowerCase().replace(/[^a-z0-9]/g, '');
            const normalizedQuery = normalize(query);

            const displayStores = state.kkStores.filter(store => 
                normalize(store.name).includes(normalizedQuery) || 
                (store.address && normalize(store.address).includes(normalizedQuery))
            ).slice(0, 50);

            if (displayStores.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-subtle flex flex-col items-center gap-3">
                        <span class="text-3xl">🔍</span>
                        <p class="text-sm font-semibold text-foreground">Cabang tidak ditemukan.</p>
                        <p class="text-xs mb-2">Tidak ada di daftar? Bisa ketik manual di bawah ini.</p>
                        <button onclick="selectManualStore('${escapeHtml(query)}')" class="bg-surface border border-border text-foreground px-5 py-3 rounded-full text-xs font-bold shadow-sm hover:border-[#B43A34]/40 transition-all">
                            Pilih Cabang: "${escapeHtml(query)}"
                        </button>
                    </div>
                `;
                return;
            }
            container.innerHTML = displayStores.map(store => {
                const bgClass = 'bg-white border-border/60';
                const hoverClass = 'hover:border-[#B43A34]/40';
                return `
                    <button onclick="selectKKStore(${store.id})" class="w-full text-left ${bgClass} p-4 rounded-[1.25rem] border shadow-sm ${hoverClass} transition-colors flex items-start gap-3">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2 mb-1">
                                <h4 class="font-semibold text-foreground text-sm line-clamp-1">${store.name}</h4>
                            </div>
                            <p class="text-xs text-subtle line-clamp-2 leading-relaxed">${store.address}</p>
                        </div>
                    </button>
                `;
            }).join('');
        };

        window.selectManualStore = function(storeName) {
            const manualId = Date.now();
            state.kkStores.push({
                id: manualId,
                name: storeName,
                address: 'Diinput manual oleh pembeli'
            });
            selectKKStore(manualId);
        };

        function renderPickupStoreField(inputIcon, inputLabel) {
            return `
                <div class="premium-surface p-5 rounded-[1.5rem] mt-3">
                    <label class="block text-[10px] uppercase tracking-[0.24em] text-subtle font-semibold mb-3 flex items-center gap-2">
                        ${inputIcon} ${inputLabel} <span class="text-[#9E3C3C]">*</span>
                    </label>
                    <p class="mb-4 text-[11px] sm:text-xs leading-relaxed font-semibold text-subtle">
                        Pastikan store yang di pilih sudah benar.
                    </p>
                    <input type="text" value="${escapeHtml(state.storeLocation)}" readonly placeholder="Contoh: Cabang Grand Indonesia..." class="w-full border border-border px-5 py-4 rounded-[1.25rem] text-sm focus:outline-none focus:border-primary/40 focus:ring-1 focus:ring-primary/20 font-medium placeholder:text-subtle/45 bg-black/5 text-foreground/70 cursor-not-allowed border-black/10" />
                </div>
            `;
        }

        function renderPickupNameField() {
            return `
                <div class="premium-surface p-5 rounded-[1.5rem] mt-3">
                    <label class="block text-[10px] uppercase tracking-[0.24em] text-subtle font-semibold mb-4 flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg> Atas Nama Pengambilan <span class="text-[#9E3C3C]">*</span>
                    </label>
                    <input type="text" value="${escapeHtml(state.customPickupName)}" oninput="state.customPickupName = this.value" placeholder="Ketik nama untuk pick up..." class="w-full bg-surface border border-border px-5 py-4 rounded-[1.25rem] text-sm focus:outline-none focus:border-primary/40 focus:ring-1 focus:ring-primary/20 font-medium placeholder:text-subtle/45" />
                </div>
            `;
        }

        const renderProductTile = (product, options = {}) => {
            const safeImage = product.image || 'https://placehold.co/600x750/F7F5F0/77756D?text=No+Image';
            let displayOriginal = product.originalPrice;
            let displayPromo = product.promoPrice || product.originalPrice;
            
            const qtyInCart = state.cart.filter(i => i.id === product.id || i.id.startsWith(product.id + '-')).reduce((sum, item) => sum + (item.quantity || 0), 0);
            const cartBadgeHtml = qtyInCart > 0 ? `<div class="absolute top-2 right-2 z-20 bg-primary text-white text-[9px] font-bold px-2 py-1 rounded-full shadow-md">🛒 ${qtyInCart}x</div>` : '';

            const isSoldOut = product.isSoldOut === true;
            const opacityClass = isSoldOut ? 'opacity-40 grayscale cursor-not-allowed' : 'cursor-pointer';
            const clickEvent = isSoldOut ? `onclick="showToast('Maaf, menu ini sedang kosong/habis di cabang ini', 'error')"` : `onclick="window.location.hash = 'product-${product.id}'"`;
            const soldOutBadge = isSoldOut ? `<div class="absolute inset-0 z-30 flex items-center justify-center backdrop-blur-[1px] bg-white/40 rounded-[1.15rem] sm:rounded-[1.55rem]"><span class="bg-[#B43A34] text-white px-3 py-1.5 rounded-full text-[10px] font-extrabold tracking-widest shadow-md border border-white/20">SOLD OUT</span></div>` : '';

            return `
                <article class="product-card modern-product-card flex flex-col h-full group rounded-[1.45rem] sm:rounded-[1.85rem] overflow-hidden ${opacityClass}" ${clickEvent}>
                    <div class="p-2 sm:p-3 pb-0 shrink-0">
                        <div class="modern-product-frame aspect-square rounded-[1.15rem] sm:rounded-[1.55rem] overflow-hidden relative p-2.5 sm:p-4">
                            ${cartBadgeHtml}
                            ${soldOutBadge}
                            <img src="${safeImage}" alt="${product.name}" class="w-full h-full object-contain" loading="lazy" decoding="async" onerror="this.src='https://placehold.co/600x750/F7F5F0/77756D?text=No+Image'"/>
                            <div class="absolute top-2 left-2 z-10 product-badge rounded-full px-2 py-0.5 text-[8px] sm:text-[9px] uppercase tracking-[0.11em] sm:tracking-[0.14em] font-bold max-w-[calc(100%-1rem)] truncate">${product.category}</div>
                            ${!isSoldOut ? `<div class="absolute right-2 bottom-2 z-10 quick-plus w-8 h-8 sm:w-9 sm:h-9 rounded-full flex items-center justify-center"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 5v14m7-7H5"></path></svg></div>` : ''}
                        </div>
                    </div>
                    <div class="p-3 sm:p-4 flex flex-col flex-1">
                        <h4 class="font-heading font-semibold text-[15px] sm:text-lg text-foreground leading-tight tracking-[-0.04em] line-clamp-2">${product.name}</h4>
                        <div class="mt-auto pt-2 sm:pt-2.5 flex flex-col gap-0.5">
                            <span class="text-[10px] sm:text-[11px] text-subtle line-through decoration-foreground/30">${formatPrice(displayOriginal)}</span>
                            <span class="text-[18px] sm:text-lg font-bold brand-text tracking-[-0.04em]">${formatPrice(displayPromo)}</span>
                        </div>
                    </div>
                </article>
            `;
        };

        window.updateTempNote = function(value) { state.tempNote = value; }

        window.confirmAddToCart = function() {
            if (!state.activeProduct) return;

            let finalPrice = state.activeProduct.promoPrice;
            let finalName = state.activeProduct.name;
            let finalNote = state.tempNote;
            let finalSize = state.tempSize;
            let finalSugar = state.tempSugar;

            if (state.activeProduct.sizes && state.tempSize) {
                const selectedSize = state.activeProduct.sizes.find(s => s.name === state.tempSize);
                if (selectedSize && selectedSize.promoPrice) finalPrice = selectedSize.promoPrice;
            }

            if (state.tempOatside) finalPrice += 1500;
            if (state.tempJuwara) finalPrice += 1500;

            const baseId = state.activeProduct.id;
            const uniqueId = `${baseId}${finalSize ? '-'+finalSize : ''}${finalSugar ? '-'+finalSugar : ''}${state.tempOatside ? '-oat' : ''}${state.tempJuwara ? '-juw' : ''}`;
            const finalQty = state.tempQty || 1;
            
            if (state.editingCartItemId) {
                state.cart = state.cart.filter(i => i.cartItemId !== state.editingCartItemId);
                state.editingCartItemId = null;
            }

            const existingItem = state.cart.find(item => item.id === uniqueId && item.note === finalNote);
            
            if (existingItem) {
                existingItem.quantity += finalQty;
            } else {
                state.cart.push({ 
                    ...state.activeProduct,
                    cartItemId: Date.now().toString(36) + Math.random().toString(36).substr(2),
                    id: uniqueId,
                    name: finalName,
                    promoPrice: finalPrice,
                    quantity: finalQty,
                    note: finalNote,
                    size: finalSize,
                    sugar: finalSugar,
                    oatside: state.tempOatside,
                    juwara: state.tempJuwara
                });
            }

            saveCart();
            render(); 
            showToast('Berhasil masuk keranjang! 🛒');
            safeBack();
        }

        window.editCartItem = function(cartItemId) {
            const item = state.cart.find(i => i.cartItemId === cartItemId);
            if (item) {
                const baseProduct = window.products.find(p => p.name === item.name && p.brand === item.brand);
                if (baseProduct) {
                    state.activeProduct = baseProduct;
                    state.tempQty = item.quantity;
                    state.tempSize = item.size || null;
                    state.tempSugar = item.sugar || null;
                    state.tempNote = item.note || '';
                    state.tempOatside = item.oatside || false;
                    state.tempJuwara = item.juwara || false;
                    state.editingCartItemId = cartItemId;
                    state.showCart = false;
                    render();
                }
            }
        };

        window.updateCartQty = function(cartItemId, delta) {
            const item = state.cart.find(i => i.cartItemId === cartItemId);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) state.cart = state.cart.filter(i => i.cartItemId !== cartItemId);
                saveCart();
                render();
            }
        }

        window.removeFromCart = function(cartItemId) {
            state.cart = state.cart.filter(i => i.cartItemId !== cartItemId);

        window.handleWhatsAppOrder = function() {
            const pickupStore = (state.storeLocation || '').trim();
            if (!pickupStore) { showToast('Isi lokasi pengambilan dulu!', 'error'); return; }

            let finalName = 'Yasif';
            if (state.pickupNameType === 'custom') {
                finalName = (state.customPickupName || '').trim();
                if (!finalName) { showToast('Isi atas nama pengambilan dulu!', 'error'); return; }
            }

            if (state.minPurchase32k) {
                const total = getTotalPrice();
                const totalItems = getTotalItems();
                
                const minPrice = totalItems >= 3 ? 35500 : 32000;
                const maxPrice = totalItems >= 3 ? 40500 : 39000;

                if (total < minPrice) {
                    showToast(`Minimal beli Rp ${minPrice.toLocaleString('id-ID')} untuk ${totalItems} item! ✌️`, 'error');
                    return;
                }
                if (total > maxPrice) {
                    showToast(`Gagal! Total belanja melebihi batas promo voucher (Maks Rp ${maxPrice.toLocaleString('id-ID')} untuk ${totalItems} item).`, 'error');
                    return;
                }
            } else {
                if (getTotalItems() === 2 && getTotalPrice() > 42000) {
                    showToast('Gagal! Total 2 item melebihi batas promo (Maks Rp 42.000). Silakan ganti menu lebih murah ATAU tambah item lagi.', 'error');
                    return;
                }
            }

            if (!state.allowSingleItem && getTotalItems() < 2) {
                showToast('Minimal beli 2 item dulu ya (bisa minuman/makanan)! ✌️', 'error');
                return;
            }

            if (state.orderType === 'scheduled' && !state.scheduledTime) {
                showToast('Jam pengambilan belum diisi!', 'error');
                return;
            }

            state.showProcessWarning = true;
            render();
        }

        window.proceedToWhatsApp = function() {
            state.showProcessWarning = false;
            
            const pickupStore = (state.storeLocation || '').trim();
            let finalName = 'Yasif';
            if (state.pickupNameType === 'custom') {
                finalName = (state.customPickupName || '').trim();
            }
            const orderBrand = 'Kopi Kenangan';

            let message = `Orderan Baru: ${orderBrand}\n--------------------------------\n`;
            
            state.cart.forEach(item => {
                message += `• ${item.name} (${item.quantity}x)\n`;
                
                let details = [];
                if (item.size) {
                    let s = item.size.toLowerCase().includes('large') ? 'L' : 'R';
                    details.push(`size: ${s}`);
                }
                if (item.sugar) {
                    let sg = item.sugar.toLowerCase().replace(' sugar', '').replace('sugar', '').trim();
                    details.push(`sugar: ${sg}`);
                }
                if (details.length > 0) message += `   ${details.join('  ')}\n`; 
                
                let upArr = [];
                if (item.oatside) upArr.push('UP oatside + 1,5K');
                if (item.juwara) upArr.push('UP juwara + 1,5K');
                if (upArr.length > 0) message += `   ${upArr.join(' - ')}\n`; 
                
                if (item.note && item.note.trim() !== '') message += `   note: ${item.note}\n`;
                message += `   harga: ${formatPrice(item.promoPrice * item.quantity)}\n`;
            });

            let isSingleItemKK = state.allowSingleItem && getTotalItems() === 1;
            if (isSingleItemKK) {
                message += `• Biaya Pembelian 1 Item\n`;
                message += `   harga: Rp 2.000\n`;
            }
            
            message += `\nTotal: ${formatPrice(getTotalPrice())}\n--------------------------------\n`;
            message += `Pick Up Atas Nama: ${finalName}\n`; 
            message += `Lokasi Ambil: ${pickupStore}\n`;
            message += `Waktu Pesan: ${state.orderType === 'now' ? 'Sekarang' : 'JAM ' + state.scheduledTime}\n`;

            render();

            const whatsappUrl = `https://wa.me/6289678644962?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
            safeBack();
        };

                            ${state.cart.length === 0 ? `
                                <div class="flex flex-col items-center justify-center h-72 text-center">
                                    <div class="w-20 h-20 border border-border rounded-full flex items-center justify-center mb-5 text-subtle/50"><svg class="w-9 h-9" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg></div>
                                    <p class="text-subtle font-medium">Keranjang masih kosong.</p>
                                </div>
                            ` : `
                                ${getTotalItems() === 1 ? `
                                    ${state.allowSingleItem ? `
                                        <div class="mb-4 bg-amber-50 border border-amber-200 p-4 rounded-[1.25rem] flex items-start gap-3">
                                            <span class="text-xl">⚠️</span>
                                            <div>
                                                <h4 class="font-bold text-amber-900 text-sm mb-1">Peringatan Pembelian</h4>
                                                <p class="text-[11px] text-amber-800 leading-relaxed">Pembelian minimal 2 item. Apabila hanya membeli 1 item makanan/minuman, dikenakan biaya tambahan sebesar Rp 2.000.</p>
                                            </div>
                                        </div>
                                    ` : `
                                        <div class="mb-4 bg-[#B43A34]/10 border border-[#B43A34]/20 p-4 rounded-[1.25rem] flex items-start gap-3">
                                            <span class="text-xl">⚠️</span>
                                            <div>
                                                <h4 class="font-bold text-[#B43A34] text-sm mb-1">Minimal Pembelian 2 Item</h4>
                                                <p class="text-[11px] text-[#B43A34] leading-relaxed">Mohon maaf, saat ini pesanan Kopi Kenangan minimal 2 item (bisa mix makanan & minuman).</p>
                                            </div>
                                        </div>
                                    `}
                                ` : ''}

                                ${state.minPurchase32k && (getTotalPrice() < (getTotalItems() >= 3 ? 35500 : 32000) || getTotalPrice() > (getTotalItems() >= 3 ? 40500 : 39000)) ? `
                                    <div class="mb-4 bg-[#B43A34]/10 border border-[#B43A34]/20 p-4 rounded-[1.25rem] flex items-start gap-3 mt-3">
                                        <span class="text-xl">⚠️</span>
                                        <div>
                                            <h4 class="font-bold text-[#B43A34] text-sm mb-1">Syarat Promo Voucher</h4>
                                            <p class="text-[11px] text-[#B43A34] leading-relaxed">
                                                ${getTotalPrice() < (getTotalItems() >= 3 ? 35500 : 32000) 
                                                    ? 'Voucher saat ini khusus minimal pembelian Rp ' + (getTotalItems() >= 3 ? '35.500' : '32.000') + '. Yuk, sesuaikan pesananmu!' 
                                                    : 'Total belanja melebihi batas promo voucher (maksimal Rp ' + (getTotalItems() >= 3 ? '40.500' : '39.000') + '). Silakan sesuaikan pesanan!'}
                                            </p>
                                        </div>
                                    </div>
                                ` : ''}

                                ${!state.minPurchase32k && getTotalItems() === 2 && getTotalPrice() > 42000 ? `
                                    <div class="mb-4 bg-[#B43A34]/10 border border-[#B43A34]/20 p-4 rounded-[1.25rem] flex items-start gap-3 mt-3">
                                        <span class="text-xl">⚠</span>
                                        <div>
                                            <h4 class="font-bold text-[#B43A34] text-sm mb-1">Batas Promo Terlampaui</h4>
                                            <p class="text-[11px] text-[#B43A34] leading-relaxed">
                                                Khusus pembelian 2 item maksimal <b>Rp 42.000</b>. <br><b>Solusi:</b> Ganti dengan menu yang lebih murah <b>ATAU</b> tambah menu lagi agar bisa checkout.
                                            </p>
                                        </div>
                                    </div>
                                ` : ''}

                                <div class="space-y-3">
                                    ${state.cart.map(item => `
                                        <div class="flex gap-4 p-3 sm:p-4 bg-surface/70 rounded-[1.5rem] border brand-border relative group">
                                            <div class="w-20 h-20 rounded-[1.1rem] product-frame overflow-hidden shrink-0"><img src="${item.image}" class="w-full h-full object-cover" loading="lazy" onerror="this.src='https://placehold.co/200x200/F7F5F0/77756D?text=No+Image'"></div>
                                            <div class="flex-1 pr-9 min-w-0">
                                                <h4 class="font-heading font-semibold text-foreground text-base tracking-[-0.03em] line-clamp-2">${item.name}</h4>
                                                ${item.size || item.sugar || item.note || item.oatside || item.juwara ? `
                                                    <div class="text-[11px] text-subtle mt-1.5 flex flex-col gap-0.5">
                                                        ${item.size ? `<span>Ukuran: <strong class="font-semibold">${item.size}</strong></span>` : ''}
                                                        ${item.sugar ? `<span>Gula: <strong class="font-semibold">${item.sugar}</strong></span>` : ''}
                                                        ${item.oatside || item.juwara ? `<span>Upgrade: <strong class="font-semibold brand-text">${[item.oatside ? 'Oatside' : '', item.juwara ? 'Juwara Beans' : ''].filter(Boolean).join(' & ')}</strong></span>` : ''}
                                                        ${item.note ? `<span class="italic text-foreground mt-0.5">Catatan: ${item.note}</span>` : ''}
                                                    </div>
                                                ` : ''}
                                                <div class="flex justify-between items-end mt-3">
                                                    <p class="text-sm font-semibold text-foreground tracking-[-0.02em]">${formatPrice(item.promoPrice)}</p>
                                                    <div class="flex items-center gap-3 bg-background border border-border rounded-full p-1">
                                                        <button onclick="updateCartQty('${item.cartItemId}', -1)" class="w-6 h-6 rounded-full bg-surface text-foreground font-bold flex items-center justify-center">-</button>
                                                        <span class="text-xs font-bold w-4 text-center text-foreground">${item.quantity}</span>
                                                        <button onclick="updateCartQty('${item.cartItemId}', 1)" class="w-6 h-6 rounded-full text-foreground bg-surface border border-border font-bold flex items-center justify-center">+</button>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="absolute top-4 right-3 flex gap-1">
                                                <button onclick="editCartItem('${item.cartItemId}')" class="text-subtle/50 p-1.5 hover:text-primary transition-colors"><svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg></button>
                                                <button onclick="removeFromCart('${item.cartItemId}')" class="text-subtle/50 p-1.5 hover:text-[#B43A34] transition-colors"><svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                                            </div>
                                        </div>
                                    `).join('')}

                                    ${state.allowSingleItem && getTotalItems() === 1 ? `
                                        <div class="flex justify-between items-center p-4 bg-[#B43A34]/10 rounded-[1.5rem] border border-[#B43A34]/20 mt-3">
                                            <h4 class="font-semibold text-[#B43A34] text-sm">Biaya Pembelian 1 Item</h4>
                                            <p class="text-sm font-bold text-[#B43A34]">+ Rp 2.000</p>
                                        </div>
                                    ` : ''}
                                </div>
                                <div class="premium-surface p-5 rounded-[1.5rem] mt-6">
                                    <label class="block text-[10px] uppercase tracking-[0.24em] text-subtle font-semibold mb-4 flex items-center gap-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> Waktu Pesan</label>
                                    <div class="flex gap-2 mb-4 rounded-full bg-background/70 border border-border p-1">
                                        <button onclick="state.orderType='now'; render()" class="flex-1 py-3 rounded-full text-sm font-semibold ${state.orderType === 'now' ? 'brand-button' : 'text-subtle'}">Sekarang</button>
                                        <button onclick="if(state.orderType !== 'scheduled'){ state.showScheduleWarning = true; render(); }" class="flex-1 py-3 rounded-full text-sm font-semibold ${state.orderType === 'scheduled' ? 'brand-button' : 'text-subtle'}">Jadwalkan</button>
                                    </div>
                                    ${state.orderType === 'scheduled' ? `
                                        <div class="mt-2">
                                            <div id="time-scroll-container" class="flex overflow-x-auto gap-2 pb-2 hide-scroll snap-x">
                                                ${generateTimeOptions().map(time => `
                                                    <button onclick="state.scheduledTime='${time}'; render()" class="snap-start shrink-0 py-2.5 px-5 rounded-[1rem] border text-sm font-semibold transition-all ${state.scheduledTime === time ? 'brand-button border-transparent shadow-md' : 'bg-surface border-border text-subtle hover:border-[#B43A34]/40'}">
                                                        ${time}
                                                    </button>
                                                `).join('')}
                                            </div>
                                            <p class="text-[10px] text-subtle mt-1.5 text-center italic tracking-wide">← Geser untuk memilih jam →</p>
                                        </div>
                                    ` : ''}
                                </div>
                                ${renderPickupNameField()}${renderPickupStoreField(inputIcon, inputLabel)}
                            `}
                        </div>
                        ${state.cart.length > 0 ? `
                            <div class="px-6 sm:px-8 py-6 bg-surface/86 border-t border-border/70 shrink-0">
                                <div class="flex items-center justify-between mb-5"><span class="text-[11px] uppercase tracking-[0.2em] text-subtle font-semibold">Total Pembayaran</span><span class="text-3xl font-heading font-semibold text-foreground tracking-[-0.06em]">${formatPrice(getTotalPrice())}</span></div>
                                <button onclick="handleWhatsAppOrder()" class="w-full brand-button py-4 rounded-full font-semibold text-base flex items-center justify-center gap-3"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.846 0 01-1.353-5.033c0-5.42 4.409-9.85 9.85-9.85 2.632 0 5.108 1.025 6.969 2.887 1.861 1.862 2.887 4.337 2.887 6.968.001 5.423-4.41 9.85-9.853 9.85"/></svg> Checkout WhatsApp</button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        function renderTutorialModal() {
            const steps = [
                { icon: "01", title: "Pilih Menu", desc: "Pilih menu favoritmu, lalu masukkan ke keranjang (Harga dapat berbeda tergantung store yang di pilih)" },
                { icon: "02", title: "Checkout WA", desc: "Isi nama untuk pengambilan, kemudian kirim list pesanan ke WhatsApp Admin." },
                { icon: "03", title: "Pembayaran", desc: "Lakukan pembayaran sesuai instruksi Admin di WhatsApp." },
                { icon: "04", title: "Ambil Pesanan", desc: "Datang ke store dan tunjukkan bukti pemesanan dari Admin. Selesai." }
            ];
            return `
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
                    <div class="absolute inset-0 diffused-backdrop" onclick="safeBack()"></div>
                    <div class="luxury-panel w-full max-w-[440px] rounded-[2rem] z-10 overflow-hidden flex flex-col max-h-[86vh]">
                        <div class="px-7 py-7 border-b border-border/70 bg-surface/70 flex justify-between items-start">
                            <div><p class="text-[10px] uppercase tracking-[0.24em] brand-text font-semibold mb-2">Guide</p><h3 class="font-heading font-semibold text-3xl text-foreground tracking-[-0.055em]">Cara Pemesanan</h3></div>
                            <button onclick="safeBack()" class="w-10 h-10 rounded-full border border-border flex items-center justify-center text-subtle">✕</button>
                        </div>
                        <div class="p-7 overflow-y-auto space-y-7">
                            ${steps.map((step, idx) => `
                                <div class="flex gap-5">
                                    <div class="flex flex-col items-center"><div class="w-10 h-10 rounded-full brand-button flex items-center justify-center text-[10px] tracking-[0.14em] font-semibold shrink-0">${step.icon}</div>${idx !== steps.length - 1 ? `<div class="w-px h-full bg-border my-3"></div>` : ''}</div>
                                    <div class="pb-2"><h4 class="font-heading font-semibold text-foreground text-lg tracking-[-0.035em] mb-1">${step.title}</h4><p class="text-sm text-subtle leading-relaxed">${step.desc}</p></div>
                                </div>
                            `).join('')}
                        </div>
                        <div class="p-5 bg-surface/80 border-t border-border/70">
                            <button onclick="safeBack()" class="w-full py-4 brand-button rounded-full font-semibold">Mengerti, Yuk Pesan</button>
                        </div>
                    </div>
                </div>
            `;
        }

        window.handleHashChange = function() {
            const hash = window.location.hash;
            const prevProduct = state.activeProduct;
            
            state.activeProduct = null;
            state.showCart = false;
            state.showTutorial = false;
            state.editingCartItemId = null;
            state.showProcessWarning = false;
            state.showScheduleWarning = false;

            if (hash.startsWith('#product-')) {
                const id = hash.replace('#product-', '');
                const product = window.products.find(p => p.id === id);
                if (product) {
                    if (!prevProduct || prevProduct.id !== id) {
                        state.tempNote = '';
                        state.tempQty = 1;
                        state.tempSize = product.sizes && product.sizes.length > 0 ? product.sizes[0].name : null;
                        state.tempSugar = product.defaultSugar || null;
                        state.tempOatside = false;
                        state.tempJuwara = false;
                    }
                    state.activeProduct = product;
                } else {
                    safeBack();
                    return; 
                }
            } 
            else if (hash === '#cart') {
                state.showCart = true;
            } 
            else if (hash === '#tutorial') {
                state.showTutorial = true;
            } 
            else if (hash.startsWith('#brand-')) {
                const brand = decodeURIComponent(hash.replace('#brand-', ''));
                state.selectedBrand = brand;
                state.searchQuery = ''; 
                
                if (brand === 'Kopi Kenangan') {
                    if (!state.selectedKKStore) {
                        state.showStoreSearch = true;
                    } else if (!state.hasSeenStorePrompt) {
                        state.showStorePrompt = true;
                        state.hasSeenStorePrompt = true;
                    }
                }
            } 
            else {
                state.selectedBrand = null;
                state.searchQuery = '';
                state.showStoreSearch = false;
            }
            
            render();
            
            if (hash === '') {
                 window.scrollTo(0,0);
            }
        };

        window.addEventListener('hashchange', handleHashChange);
        handleHashChange(); 
    </script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB1sNl7HsyQoG_3_UbS-H8QYmjla8i6fKc",
            authDomain: "yasif-store.firebaseapp.com",
            databaseURL: "https://yasif-store-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "yasif-store",
            storageBucket: "yasif-store.firebasestorage.app",
            messagingSenderId: "76503690642",
            appId: "1:76503690642:web:e9f3b1d73a545e102ae54b",
            measurementId: "G-P10WDJPSK4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        if (typeof state !== 'undefined') {
            state.isStoreOpen = true;
            state.closeReason = "";
            state.closeTime = "";
            state.autoClose = true;
            state.allowSingleItem = true;
            state.minPurchase32k = false;
        }

        onValue(ref(db, 'store_status'), (snapshot) => {
            const data = snapshot.val();
            const storeData = (typeof data === 'object' && data !== null) ? data : { isOpen: !!data, reason: "Admin sedang ada kesibukan lain.", time: "", autoClose: true, allowSingleItem: true, minPurchase32k: false };
            
            if (typeof state !== 'undefined') {
                state.isStoreOpen = storeData.isOpen;
                state.closeReason = storeData.reason;
                state.closeTime = storeData.time;
                state.autoClose = storeData.autoClose !== false; 
                state.allowSingleItem = storeData.allowSingleItem !== false;
                state.minPurchase32k = storeData.minPurchase32k === true;
                if (typeof render === 'function') render();
            }
        });
    </script>
</body>
</html>
