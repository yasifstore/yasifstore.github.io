<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Yasif Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F7F5F0] flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-7 sm:p-8 rounded-[2rem] shadow-xl text-center max-w-sm w-full border border-gray-100 relative">
        <h1 class="text-2xl font-bold mb-6 text-gray-900">Admin Yasif Store</h1>
        
        <div class="mb-5 flex items-center justify-between p-4 border border-gray-200 rounded-2xl bg-gray-50/50">
            <div class="text-left">
                <span class="block text-sm font-bold text-gray-800">Mode Auto-Tutup</span>
                <span class="block text-[10px] font-medium text-gray-500 mt-0.5">Otomatis tutup 01:00 - 09:00</span>
            </div>
            <label class="relative inline-flex items-center cursor-pointer shrink-0">
                <input type="checkbox" id="autoCloseToggle" class="sr-only peer">
                <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-600"></div>
            </label>
        </div>

        <div class="mb-5 flex items-center justify-between p-4 border border-gray-200 rounded-2xl bg-gray-50/50">
            <div class="text-left">
                <span class="block text-sm font-bold text-gray-800">Beli 1 Item (Admin 1.500)</span>
                <span class="block text-[10px] font-medium text-gray-500 mt-0.5">Off = Wajib beli min. 2 item</span>
            </div>
            <label class="relative inline-flex items-center cursor-pointer shrink-0">
                <input type="checkbox" id="singleItemToggle" class="sr-only peer">
                <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-600"></div>
            </label>
        </div>

        <div class="mb-5 flex items-center justify-between p-4 border border-gray-200 rounded-2xl bg-gray-50/50">
            <div class="text-left">
                <span class="block text-sm font-bold text-gray-800">Minimal Beli Rp 32.000</span>
                <span class="block text-[10px] font-medium text-gray-500 mt-0.5">Voucher khusus 32k</span>
            </div>
            <label class="relative inline-flex items-center cursor-pointer shrink-0">
                <input type="checkbox" id="min32kToggle" class="sr-only peer">
                <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-600"></div>
            </label>
        </div>

        <input type="text" id="reasonInput" list="templateMalam" placeholder="Ketik alasan tutup di sini..." class="w-full mb-4 p-4 border border-gray-200 rounded-2xl text-sm font-medium focus:outline-none focus:border-emerald-700 bg-white shadow-sm">
        <datalist id="templateMalam">
            <option value="Admin sudah tepar dan tertidur nyenyak."></option>
        </datalist>

        <button id="toggleBtn" class="w-full py-4 rounded-full font-bold text-white text-lg mb-4 shadow-md transition-all" style="background-color: gray;">Loading...</button>
        <p id="statusText" class="text-gray-500 font-semibold text-sm"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB1sNl7HsyQoG_3_UbS-H8QYmjla8i6fKc",
            authDomain: "yasif-store.firebaseapp.com",
            databaseURL: "https://yasif-store-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "yasif-store",
            storageBucket: "yasif-store.firebasestorage.app",
            messagingSenderId: "76503690642",
            appId: "1:76503690642:web:e9f3b1d73a545e102ae54b",
            measurementId: "G-P10WDJPSK4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const btn = document.getElementById('toggleBtn');
        const text = document.getElementById('statusText');
        const reasonInput = document.getElementById('reasonInput');
        const autoCloseToggle = document.getElementById('autoCloseToggle');
        const singleItemToggle = document.getElementById('singleItemToggle');
        const min32kToggle = document.getElementById('min32kToggle');
        
        let currentStatus = { isOpen: true, reason: "", time: "", autoClose: true, allowSingleItem: true, minPurchase32k: false };

        onValue(ref(db, 'store_status'), (snapshot) => {
            const data = snapshot.val();
            currentStatus = (typeof data === 'object' && data !== null) ? data : { isOpen: !!data, reason: "Admin sedang sibuk.", time: "", autoClose: true, allowSingleItem: true, minPurchase32k: false };
            
            autoCloseToggle.checked = currentStatus.autoClose !== false;
            singleItemToggle.checked = currentStatus.allowSingleItem !== false;
            min32kToggle.checked = currentStatus.minPurchase32k === true;

            if (currentStatus.isOpen) {
                btn.style.backgroundColor = '#1F2A24';
                btn.innerText = 'TUTUP TOKO';
                text.innerText = '🟢 Toko: BUKA';
                reasonInput.disabled = false;
            } else {
                btn.style.backgroundColor = '#9E3C3C';
                btn.innerText = 'BUKA TOKO';
                text.innerText = '🔴 Toko: TUTUP';
                reasonInput.disabled = true;
            }
        });

        autoCloseToggle.onchange = (e) => {
            currentStatus.autoClose = e.target.checked;
            set(ref(db, 'store_status'), currentStatus);
        };

        singleItemToggle.onchange = (e) => {
            currentStatus.allowSingleItem = e.target.checked;
            set(ref(db, 'store_status'), currentStatus);
        };

        min32kToggle.onchange = (e) => {
            currentStatus.minPurchase32k = e.target.checked;
            set(ref(db, 'store_status'), currentStatus);
        };

        btn.onclick = () => {
            if (currentStatus.isOpen) {
                const now = new Date();
                const timeString = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + ' WIB';
                
                set(ref(db, 'store_status'), { 
                    isOpen: false, 
                    reason: reasonInput.value || "Admin sedang ada kesibukan lain.", 
                    time: timeString,
                    autoClose: currentStatus.autoClose,
                    allowSingleItem: currentStatus.allowSingleItem,
                    minPurchase32k: currentStatus.minPurchase32k
                });
            } else {
                set(ref(db, 'store_status'), { 
                    isOpen: true, 
                    reason: "", 
                    time: "",
                    autoClose: currentStatus.autoClose,
                    allowSingleItem: currentStatus.allowSingleItem,
                    minPurchase32k: currentStatus.minPurchase32k
                });
            }
        };
    </script>
</body>
</html>
