<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Admin Yasif Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F7F5F0] flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-[2rem] shadow-xl text-center max-w-sm w-full border border-gray-100">
        <h1 class="text-2xl font-bold mb-6">Status Toko</h1>
        <button id="toggleBtn" class="w-full py-4 rounded-full font-bold text-white text-lg mb-4" style="background-color: gray;">Loading...</button>
        <p id="statusText" class="text-gray-500 font-medium">Mengecek status...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB1sNl7HsyQoG_3_UbS-H8QYmjla8i6fKc",
            authDomain: "yasif-store.firebaseapp.com",
            databaseURL: "https://yasif-store-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "yasif-store",
            storageBucket: "yasif-store.firebasestorage.app",
            messagingSenderId: "76503690642",
            appId: "1:76503690642:web:e9f3b1d73a545e102ae54b",
            measurementId: "G-P10WDJPSK4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const btn = document.getElementById('toggleBtn');
        const text = document.getElementById('statusText');
        let isStoreOpen = true;

        onValue(ref(db, 'store_status'), (snapshot) => {
            isStoreOpen = snapshot.exists() ? snapshot.val() : true;
            if (isStoreOpen) {
                btn.style.backgroundColor = '#1F2A24';
                btn.innerText = 'TUTUP TOKO';
                text.innerText = '🟢 Toko saat ini: BUKA';
            } else {
                btn.style.backgroundColor = '#9E3C3C';
                btn.innerText = 'BUKA TOKO';
                text.innerText = '🔴 Toko saat ini: TUTUP';
            }
        });

        btn.onclick = () => {
            set(ref(db, 'store_status'), !isStoreOpen);
        };
    </script>
</body>
</html>
