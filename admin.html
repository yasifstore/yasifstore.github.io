<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Admin Yasif Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F7F5F0] flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-[2rem] shadow-xl text-center max-w-sm w-full border border-gray-100">
        <h1 class="text-2xl font-bold mb-6">Admin Yasif Store</h1>
        
        <select id="reasonSelect" class="w-full mb-4 p-3 border rounded-xl text-sm focus:outline-none focus:border-emerald-700">
            <option value="Admin sedang ada kesibukan lain.">Admin sedang ada kesibukan lain.</option>
            <option value="Lagi istirahat & makan dulu ya.">Lagi istirahat & makan dulu ya.</option>
            <option value="Stok promo sedang habis.">Stok promo sedang habis.</option>
            <option value="Admin sudah tepar dan tertidur nyenyak.">Admin sudah tepar dan tertidur nyenyak.</option>
        </select>

        <button id="toggleBtn" class="w-full py-4 rounded-full font-bold text-white text-lg mb-4 shadow-md transition-all" style="background-color: gray;">Loading...</button>
        <p id="statusText" class="text-gray-500 font-medium text-sm"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB1sNl7HsyQoG_3_UbS-H8QYmjla8i6fKc",
            authDomain: "yasif-store.firebaseapp.com",
            databaseURL: "https://yasif-store-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "yasif-store",
            storageBucket: "yasif-store.firebasestorage.app",
            messagingSenderId: "76503690642",
            appId: "1:76503690642:web:e9f3b1d73a545e102ae54b",
            measurementId: "G-P10WDJPSK4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const btn = document.getElementById('toggleBtn');
        const text = document.getElementById('statusText');
        const reasonSelect = document.getElementById('reasonSelect');
        let currentStatus = { isOpen: true, reason: "", time: "" };

        onValue(ref(db, 'store_status'), (snapshot) => {
            const data = snapshot.val();
            currentStatus = (typeof data === 'object' && data !== null) ? data : { isOpen: !!data, reason: "Admin sedang sibuk.", time: "" };
            
            if (currentStatus.isOpen) {
                btn.style.backgroundColor = '#1F2A24';
                btn.innerText = 'TUTUP TOKO';
                text.innerText = '🟢 Toko: BUKA';
                reasonSelect.disabled = false;
            } else {
                btn.style.backgroundColor = '#9E3C3C';
                btn.innerText = 'BUKA TOKO';
                text.innerText = '🔴 Toko: TUTUP';
                reasonSelect.disabled = true;
            }
        });

        btn.onclick = () => {
            if (currentStatus.isOpen) {
                // Ambil jam saat ini secara real-time
                const now = new Date();
                const timeString = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + ' WIB';
                
                set(ref(db, 'store_status'), { 
                    isOpen: false, 
                    reason: reasonSelect.value, 
                    time: timeString 
                });
            } else {
                set(ref(db, 'store_status'), { 
                    isOpen: true, 
                    reason: "", 
                    time: "" 
                });
            }
        };
    </script>
</body>
</html>
